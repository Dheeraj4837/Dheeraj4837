
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Dheeraj, Full Stack Developer</title>
  <desc id="d">An animated request travels from React to Spring Boot to MySQL and back.</desc>

  <!-- Background -->
  <rect width="900" height="340" rx="18" fill="#0E1726"/>

  <!-- Drifting dots (background motion) -->
  <g fill="#2B3D5C">
    <circle cx="600" cy="70" r="3"><animate attributeName="cy" values="70;50;70" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="130" r="2"><animate attributeName="cy" values="130;150;130" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="60" r="4"><animate attributeName="cy" values="60;80;60" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="830" cy="140" r="2.5"><animate attributeName="cy" values="140;120;140" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="150" r="2"><animate attributeName="cy" values="150;132;150" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="40" r="2"><animate attributeName="cy" values="40;58;40" dur="6.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Text -->
  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="48" y="78" font-size="20" fill="#8FA3BF">Hi, I'm</text>
    <text x="46" y="142" font-size="68" font-weight="700" fill="#E8EEF7">Dheeraj</text>
    <text x="48" y="182" font-size="26" fill="#FFC857">Full Stack Developer</text>
    <text x="48" y="214" font-size="17" fill="#8FA3BF">Java, Spring Boot, React and MySQL</text>
    <!-- blinking cursor -->
    <rect x="352" y="198" width="3" height="18" fill="#FFC857">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Pipeline: React -> Spring Boot -> MySQL -->
  <!-- flowing dashed line -->
  <line x1="170" y1="285" x2="730" y2="285" stroke="#2B3D5C" stroke-width="2" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" from="12" to="0" dur="1s" repeatCount="indefinite"/>
  </line>

  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#8FA3BF" text-anchor="middle">
    <text x="310" y="271">HTTP / JSON</text>
    <text x="590" y="271">JDBC</text>
  </g>

  <!-- Nodes -->
  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#E8EEF7" text-anchor="middle">
    <rect x="95" y="257" width="150" height="56" rx="12" fill="#16233A" stroke="#61DAFB" stroke-width="2.5">
      <animate attributeName="stroke-opacity" values="1;.3;.3;.3;1" keyTimes="0;.12;.5;.88;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="170" y="291">React</text>

    <rect x="375" y="257" width="150" height="56" rx="12" fill="#16233A" stroke="#6DB33F" stroke-width="2.5">
      <animate attributeName="stroke-opacity" values=".3;1;.3;1;.3" keyTimes="0;.25;.5;.75;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="450" y="291">Spring Boot</text>

    <rect x="655" y="257" width="150" height="56" rx="12" fill="#16233A" stroke="#4F9BD9" stroke-width="2.5">
      <animate attributeName="stroke-opacity" values=".3;.3;1;.3;.3" keyTimes="0;.38;.5;.62;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="730" y="291">MySQL</text>
  </g>

  <!-- Moving packet (goes to MySQL, then comes back) -->
  <path id="route" d="M170,285 H730" fill="none"/>
  <g>
    <circle r="14" fill="#FFC857" opacity=".25"/>
    <circle r="7" fill="#FFC857"/>
    <animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;0" keyTimes="0;.5;1">
      <mpath xlink:href="#route"/>
    </animateMotion>
  </g>
</svg>
